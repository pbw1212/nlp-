[metadata]
name = mapas-agent-memory
version = 0.1.0
description = MAPAS multi-agent personalized agentic system with long-term memory
long_description = file: README.md
long_description_content_type = text/markdown

[options]
python_requires = >=3.10
packages = find_namespace:
include_package_data = False
install_requires =
    jsonschema>=4.0.0

[options.packages.find]
where = code
include =
    src.memory*
